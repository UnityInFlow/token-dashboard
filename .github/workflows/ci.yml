name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    # RUNNER POLICY — deliberate, do not "restore" a self-hosted label here.
    #
    # This repo is PUBLIC and the org runner group enforces
    # `allows_public_repositories: false`, so NO self-hosted job can be
    # scheduled here at all, whatever the trigger. The previous
    # `[self-hosted, Linux, X64]` label meant this workflow queued until
    # GitHub cancelled it at the 24-hour timeout: run 27408163186 started
    # 2026-06-12T09:48:44Z and was cancelled 2026-06-13T09:48:46Z, and no
    # CI has run since.
    #
    # Public UnityInFlow repos run on GitHub-hosted runners (fixed image
    # `ubuntu-24.04`, not `ubuntu-latest`). This job builds and tests only,
    # secretless and `contents: read`; release work (release.yml) is also
    # GitHub-hosted and runs only on tag pushes a fork cannot fire.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Build
        run: ./gradlew build

      - name: Run tests
        run: ./gradlew test

      - name: Run ktlint
        run: ./gradlew ktlintCheck

      - name: Build shadow JAR
        run: ./gradlew shadowJar
