name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write    # for creating GH Release
  packages: write    # for ghcr.io push

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Lint + build + tests + shadow jar
        run: ./gradlew clean build shadowJar

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Locate fat jar
        id: jar
        run: |
          jar_path="build/libs/token-dashboard-${{ steps.version.outputs.version }}-all.jar"
          if [ ! -f "$jar_path" ]; then
            jar_path=$(ls build/libs/token-dashboard-*-all.jar | head -1)
          fi
          echo "path=$jar_path" >> "$GITHUB_OUTPUT"
          echo "Fat jar at: $jar_path"
          ls -la "$jar_path"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: |
            ghcr.io/unityinflow/token-dashboard:${{ steps.version.outputs.version }}
            ghcr.io/unityinflow/token-dashboard:latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: token-dashboard ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: ${{ steps.jar.outputs.path }}
          body: |
            token-dashboard **${{ github.ref_name }}** released.

            ## Run via Docker

            ```bash
            docker pull ghcr.io/unityinflow/token-dashboard:${{ steps.version.outputs.version }}
            docker run -p 8080:8080 -p 4317:4317 \
              ghcr.io/unityinflow/token-dashboard:${{ steps.version.outputs.version }}
            ```

            Then open http://localhost:8080

            ## Run via fat jar (requires Java 21+)

            Download the attached `token-dashboard-${{ steps.version.outputs.version }}-all.jar` and:

            ```bash
            java -jar token-dashboard-${{ steps.version.outputs.version }}-all.jar
            ```

            See the auto-generated notes below for changes since the previous release.
